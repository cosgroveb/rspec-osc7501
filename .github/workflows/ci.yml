name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release-artifact:
        description: Prepared release bundle from the calling workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.12"
            rspec_core: "3.12.0"
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "4.0"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: macos-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
    runs-on: ${{ matrix.os }}
    env:
      RSPEC_MINOR: ${{ matrix.rspec_minor }}
      RSPEC_CORE_VERSION: ${{ matrix.rspec_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - if: inputs.release-artifact != ''
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - if: inputs.release-artifact != ''
        run: ruby script/release.rb restore "$RUNNER_TEMP/release"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.rspec_minor }}-${{ matrix.rspec_core }}
      - run: bundle exec rake spec package rdoc
      - run: gem install pkg/*.gem --local --install-dir tmp/gem-home --ignore-dependencies --no-document
      - run: |
          ruby -I"$(bundle show rspec-core)/lib" \
               -I"$(bundle show rspec-support)/lib" \
               -I"$(find tmp/gem-home/gems -maxdepth 1 -type d -name 'rspec-osc7501-*' -print -quit)/lib" \
               -r rspec/osc7501 -e "
            entrypoint = \$LOADED_FEATURES.find { |file| file.end_with?('/rspec/osc7501.rb') }
            abort unless entrypoint && File.realpath(entrypoint).start_with?(File.realpath('tmp/gem-home') + '/')
            abort unless defined?(RSpec::OSC7501::Formatter)
          "
