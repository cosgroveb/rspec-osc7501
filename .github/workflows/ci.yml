name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-artifact:
        description: Prepared release bundle from the calling workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release-artifact == '' }}

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.12"
            rspec_core: "3.12.0"
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "4.0"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: macos-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
    runs-on: ${{ matrix.os }}
    env:
      RSPEC_MINOR: ${{ matrix.rspec_minor }}
      RSPEC_CORE_VERSION: ${{ matrix.rspec_core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - if: inputs.release-artifact != ''
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - if: inputs.release-artifact != ''
        run: ruby script/release.rb restore "$RUNNER_TEMP/release"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.rspec_minor }}-${{ matrix.rspec_core }}
      - name: Install actionlint
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check code quality
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        run: bundle exec rake quality
      - run: bundle exec rake spec smoke rdoc
